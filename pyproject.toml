[project]
name = "geg-tomd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Guerra", email = "gabrielcake9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "geg-core",
    "google-genai>=2.20.0",
    "pymupdf>=1.28.2",
    "typer>=0.27.1",
]

[project.scripts]
geg-tomd = "geg_tomd.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
geg-core = { path = "../geg-core" }
